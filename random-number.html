<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랜덤 뽑기 | 숫자·이름 제비뽑기 - Praier</title><meta name="description" content="최소값과 최대값으로 숫자를 만들거나 이름을 직접 입력해 제비를 여러 번 뽑을 수 있는 랜덤 뽑기 도구입니다."><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="nav"><a class="brand" href="index.html"><span class="brand-mark">🎲</span>Praier 랜덤 도구</a><button class="menu-toggle">☰</button><nav class="nav-links"><a href="index.html">홈</a><a href="index.html#tools">랜덤 도구</a><a href="guide.html">활용 가이드</a><a href="about.html">사이트 소개</a><a href="contact.html">문의하기</a></nav></div></header><main><div class="container page-hero"><div class="eyebrow">랜덤 도구</div><h1>랜덤 뽑기</h1><p class="lead">숫자 범위로 제비를 만들거나 이름·메뉴 등을 직접 입력하고, 원하는 제비를 여러 번 골라 결과를 확인해보세요.</p></div><section class="section"><div class="container tool-layout"><div class="card tool-panel"><div class="field"><label for="drawMode">입력 방식</label><select id="drawMode"><option value="number">숫자 범위</option><option value="text">직접 입력</option></select></div><div id="rangeFields" class="controls" style="margin-top:12px"><div class="field"><label for="min">최소값</label><input id="min" type="number" value="1"></div><div class="field"><label for="max">최대값</label><input id="max" type="number" value="20"></div></div><div id="textFields" class="controls" style="margin-top:12px" hidden><div class="field"><label for="items">제비 내용</label><textarea id="items" placeholder="철수\n영희\n민수\n지수"></textarea><div class="muted">한 줄에 하나씩 입력하세요.</div></div></div><div class="field" style="margin-top:12px"><label for="drawCount">뽑을 횟수</label><input id="drawCount" type="number" min="1" value="1"></div><button class="btn btn-primary" id="drawBtn" style="width:100%;margin-top:14px">🥢 제비 만들기</button><div class="notice" style="margin-top:14px">제비를 만든 뒤 막대 하나를 직접 클릭해 뽑습니다. 한 번 뽑힌 제비는 다시 선택되지 않습니다.</div></div><div class="card tool-panel"><div class="draw-board"><h3 style="margin-top:0">제비 뽑기</h3><div id="sticks" class="sticks"></div></div><div style="margin-top:18px"><h3>뽑은 결과</h3><div id="drawResults" class="picked-list"></div></div></div></div></section></main><footer class="footer"><div class="footer-inner"><div>© <span data-year></span> Praier</div><div class="footer-links"><a href="index.html">홈</a><a href="dice.html">주사위 굴리기</a><a href="coin.html">동전 던지기</a><a href="team-generator.html">팀 나누기</a></div></div></footer><script src="js/common.js"></script><script src="js/random-number.js"></script></body></html>
